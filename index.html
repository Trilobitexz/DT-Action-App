<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊地點分析 APP - 設計思考原型</title>
  <!-- 引入 Leaflet 地圖樣式 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- 頂部導航列 -->
    <header class="app-header">
      <div class="header-inner">
        <div class="logo-group" onclick="window.appNavigate('world')">
          <div class="logo-badge">✈️</div>
          <div>
            <h1>旅遊地點分析 APP</h1>
            <div class="sub">直飛航班 · 物價指數 · 熱門景點分析</div>
          </div>
        </div>

        <!-- 麵包屑導航 (容錯與平順返回) -->
        <nav class="breadcrumb-nav" id="breadcrumb-nav">
          <span class="breadcrumb-item active">🌍 世界地圖</span>
        </nav>

        <button class="btn-reset" id="btn-reset-global" title="回到起點重新篩選">
          🔄 重新選擇
        </button>
      </div>
    </header>

    <!-- 畫面 1：世界地圖 (World Map View) -->
    <main id="view-world" class="view-panel active">
      <div class="map-hero-card">
        <div class="map-toolbar">
          <div>
            <h2 style="font-size: 1.25rem; font-weight:700;">探索目的地：點選大洲或使用下方快捷選項</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted);">支援滑鼠滾輪/按鈕縮放與拖曳平移地圖視圖</p>
          </div>
          <div class="map-controls">
            <button class="map-btn" id="btn-zoom-in" title="放大地圖">+</button>
            <button class="map-btn" id="btn-zoom-out" title="縮小地圖">-</button>
            <button class="map-btn" id="btn-zoom-reset" title="重設視圖" style="font-size:0.8rem; width: auto; padding: 0 8px;">重設</button>
          </div>
        </div>

        <!-- Leaflet 互動世界地圖容器 -->
        <div id="leaflet-map"></div>

        <!-- 快捷標籤列 -->
        <div class="map-continent-chips">
          <span style="font-size:0.875rem; font-weight:600; color:var(--text-muted); align-self:center;">快速選擇：</span>
          <button class="continent-chip-btn" data-continent-id="asia">🌏 亞洲 (Asia)</button>
          <button class="continent-chip-btn" data-continent-id="europe">🏰 歐洲 (Europe)</button>
          <button class="continent-chip-btn" data-continent-id="north-america">🗽 北美洲 (North America)</button>
          <button class="continent-chip-btn" data-continent-id="oceania">🦘 大洋洲 (Oceania)</button>
        </div>
      </div>
    </main>

    <!-- 畫面 2：大洲層級視圖 (Continent View) -->
    <section id="view-continent" class="view-panel">
      <!-- 篩選列與文字方框 (落實 V2 元件) -->
      <div class="filter-bar-card">
        <div>
          <h2 id="continent-title" style="font-size: 1.4rem; font-weight:700; margin-bottom: 0.25rem;">亞洲</h2>
          <p id="continent-desc" style="font-size:0.9rem; color:var(--text-muted);">文化多元、美食豐富、台灣旅客最喜愛的直飛旅遊勝地。</p>
        </div>
        
        <div class="filter-inputs-row">
          <div class="search-input-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="country-search-input" class="search-input" placeholder="搜尋國家或城市名稱（如：日本、曼谷）...">
          </div>
          <div class="filter-checkboxes">
            <label class="checkbox-label">
              <input type="checkbox" id="filter-direct-flight">
              <span>✈️ 僅看支援直飛</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="filter-budget">
              <span>💰 親民/中等預算</span>
            </label>
          </div>
        </div>
      </div>

      <!-- 國家卡片列表 -->
      <div class="cards-grid" id="countries-cards-grid"></div>

      <!-- 無結果狀態 (Empty State) -->
      <div id="continent-empty-state" style="display:none; text-align:center; padding: 3rem 1rem; background:white; border-radius:12px; border:1px dashed var(--border-color);">
        <p style="font-size:1.1rem; color:var(--text-muted); margin-bottom:0.75rem;">查無符合條件的旅遊國家</p>
        <button class="btn-reset" onclick="document.getElementById('country-search-input').value=''; document.getElementById('filter-direct-flight').checked=false; document.getElementById('filter-budget').checked=false; window.appState.filters={search:'', directOnly:false, budgetAffordable:false}; window.appNavigate('continent');">
          重設篩選條件
        </button>
      </div>
    </section>

    <!-- 畫面 3：國家與城市層級 (Country & City View) -->
    <section id="view-country" class="view-panel">
      <!-- 國家摘要標頭 -->
      <div class="detail-header-card">
        <div class="detail-title-wrap">
          <span class="detail-flag" id="detail-country-flag">🇯🇵</span>
          <div>
            <h2 id="detail-country-name" style="font-size:1.5rem; font-weight:800;">日本 (Japan)</h2>
            <p id="detail-currency-visa" style="font-size:0.9rem; color:var(--text-muted);">幣別資訊與簽證要求</p>
          </div>
        </div>
        <button class="btn-reset" onclick="window.appNavigate('continent')">
          ← 返回大洲選單
        </button>
      </div>

      <!-- 核心卡片：航班直飛情報 + 當地物價水平 -->
      <div class="detail-info-grid">
        <div class="info-card">
          <div class="info-card-header">
            <span style="font-size:1.25rem;">✈️</span>
            <h4>航班資訊與直飛情報</h4>
          </div>
          <div id="detail-flight-content"></div>
        </div>

        <div class="info-card">
          <div class="info-card-header">
            <span style="font-size:1.25rem;">💰</span>
            <h4>當地物價水準與日常開銷</h4>
          </div>
          <div id="detail-price-content"></div>
        </div>
      </div>

      <!-- 城市分頁切換與熱門景點清單 (V2 優化) -->
      <div class="city-tabs-card">
        <div style="margin-bottom: 1rem;">
          <h3 style="font-size:1.2rem; font-weight:700;">🏙️ 城市切換與熱門景點清單</h3>
          <p id="city-description-text" style="font-size:0.9rem; color:var(--text-muted); margin-top:0.25rem;">城市特色與風貌介紹</p>
        </div>
        <div class="city-tab-list" id="city-tab-list"></div>
        <div class="spot-list" id="city-spots-list"></div>
      </div>
    </section>

    <!-- 載入 Leaflet.js 地圖套件與設定模組 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="src/js/map/geoContinents.js"></script>
    <script src="src/js/map/mapManager.js"></script>

    <!-- 載入資料庫與各洲資料模組 -->
    <script src="src/data/travelData.js"></script>
    <script src="src/data/countries/asia.js"></script>
    <script src="src/data/countries/europe.js"></script>
    <script src="src/data/countries/others.js"></script>
    <!-- 載入視圖模組 -->
    <script src="src/js/modules/continentView.js"></script>
    <script src="src/js/modules/countryView.js"></script>
    <script src="src/js/app.js"></script>
  </div>
</body>
</html>
